<title>Toy Window</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://m.media-amazon.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
  :root{
    --bg:#fbf6ec; --bg-2:#f2e9d8; --card:#ffffff;
    --ink:#241f1a; --ink-soft:#6f6656; --line:#e7dcc6;
    --flame:#ff5330; --flame-ink:#c8320f; --blue:#2f6ff0; --sun:#ffb300;
    --lens-fill:rgba(255,255,255,.24);
    --shadow:0 12px 30px -12px rgba(60,42,18,.35);
    --shadow-lg:0 30px 70px -20px rgba(35,24,8,.55);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#1a1815; --bg-2:#221f1a; --card:#2a2620;
      --ink:#f4ecdd; --ink-soft:#a99f8c; --line:#3a352c;
      --flame:#ff6a45; --flame-ink:#ff8a68; --blue:#6f9bff;
      --lens-fill:rgba(255,255,255,.15);
      --shadow:0 12px 30px -12px rgba(0,0,0,.6);
      --shadow-lg:0 30px 70px -20px rgba(0,0,0,.75);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1a1815; --bg-2:#221f1a; --card:#2a2620;
    --ink:#f4ecdd; --ink-soft:#a99f8c; --line:#3a352c;
    --flame:#ff6a45; --flame-ink:#ff8a68; --blue:#6f9bff;
    --lens-fill:rgba(255,255,255,.15);
    --shadow:0 12px 30px -12px rgba(0,0,0,.6);
    --shadow-lg:0 30px 70px -20px rgba(0,0,0,.75);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);
    font-family:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-tap-highlight-color:transparent;overflow-x:hidden}

  header{position:sticky;top:0;z-index:40;
    background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:2px solid var(--line)}
  .bar{max-width:1240px;margin:0 auto;padding:12px clamp(12px,3vw,26px);display:flex;align-items:center;gap:10px}
  .bar .mark{width:34px;height:34px;flex:none;border-radius:11px;background:var(--flame);color:#fff;
    display:grid;place-items:center;font-size:19px;box-shadow:0 6px 16px -6px var(--flame);transform:rotate(-6deg)}
  .bar h1{margin:0;font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:clamp(19px,4.2vw,25px);line-height:1}
  .bar span{color:var(--ink-soft);font-weight:700;font-size:13px}

  main{max-width:1240px;margin:0 auto;padding:clamp(14px,3vw,26px)}
  .grid{display:grid;gap:clamp(10px,1.6vw,18px);grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  @media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
  @media (min-width:1000px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
  .card{position:relative;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px;
    aspect-ratio:1/1;cursor:zoom-in;transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}
  .card img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--flame)}
  .card:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
  .card .count{position:absolute;right:8px;bottom:8px;background:var(--flame);color:#fff;
    font-weight:800;font-size:11px;padding:3px 8px;border-radius:999px;display:flex;align-items:center;gap:4px;
    box-shadow:0 4px 10px -3px rgba(0,0,0,.4)}
  .imgwrap{position:relative;width:100%;height:100%}
  .imgwrap.broken{display:none}

  .viewer{position:fixed;inset:0;z-index:100;background:rgba(24,17,10,.88);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;touch-action:none}
  .viewer.open{display:block}
  .vwrap{position:absolute;inset:0;display:flex;flex-direction:row;align-items:center;justify-content:center;
    gap:clamp(10px,2vw,26px);padding:clamp(12px,3vw,44px)}
  .vthumbs{display:flex;flex-direction:column;gap:10px;flex:none}
  .vthumb{width:74px;height:74px;border-radius:14px;border:3px solid rgba(255,255,255,.35);background:#fff;
    padding:5px;cursor:pointer;transition:border-color .12s ease,transform .12s ease}
  .vthumb img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
  .vthumb:hover{transform:translateY(-2px)}
  .vthumb[aria-current="true"]{border-color:var(--flame)}

  .stage{position:relative;background:#fff;border-radius:18px;padding:12px;box-shadow:var(--shadow-lg);
    max-width:min(78vw,880px);max-height:84vh;cursor:crosshair}
  .stage img{display:block;max-width:100%;max-height:calc(84vh - 24px);width:auto;height:auto;object-fit:contain;
    pointer-events:none;-webkit-user-drag:none;border-radius:8px}
  .stage.loading::after{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;
    border:4px solid var(--line);border-top-color:var(--flame);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .v-lens{position:absolute;pointer-events:none;border:4px solid var(--flame);background:var(--lens-fill);
    border-radius:10px;box-shadow:0 0 0 3px rgba(255,255,255,.7),0 4px 16px rgba(0,0,0,.35);display:none}
  .v-panel{position:fixed;background:#fff center/cover no-repeat;border:4px solid var(--flame);border-radius:18px;
    box-shadow:var(--shadow-lg);display:none;pointer-events:none;z-index:105}
  @media (min-width:900px){.v-panel{top:24px;right:24px;width:360px;height:360px}}
  @media (max-width:899px){.v-panel{top:8px;left:50%;transform:translateX(-50%);width:min(94vw,470px);height:min(40vh,420px)}}

  @media (max-width:899px){
    .vwrap{flex-direction:column;gap:12px}
    .stage{max-width:92vw;max-height:64vh}
    .stage img{max-height:calc(64vh - 24px)}
    .vthumbs{flex-direction:row;flex-wrap:wrap;justify-content:center;order:2}
    .vthumb{width:60px;height:60px}
  }

  .vbtn{position:fixed;z-index:110;width:56px;height:56px;border-radius:50%;border:none;
    background:rgba(255,255,255,.94);color:#241f1a;font-size:26px;font-weight:900;line-height:1;
    display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s ease}
  .vbtn:hover{transform:scale(1.06)}
  .vbtn:active{transform:scale(.93)}
  .vbtn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .v-close{top:calc(14px + env(safe-area-inset-top));left:14px;font-size:22px}
  .v-prev{left:12px;top:50%;margin-top:-28px}
  .v-next{right:12px;top:50%;margin-top:-28px}
  @media (max-width:899px){
    .v-prev{top:auto;bottom:calc(16px + env(safe-area-inset-bottom));margin-top:0;left:16px}
    .v-next{top:auto;bottom:calc(16px + env(safe-area-inset-bottom));margin-top:0;right:16px}
  }
  .vdots{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));
    display:flex;gap:7px;z-index:110;pointer-events:none}
  @media (max-width:899px){.vdots{bottom:calc(84px + env(safe-area-inset-bottom))}}
  .vdots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4)}
  .vdots i.on{background:var(--flame);width:22px;border-radius:999px}
  .hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(52px + env(safe-area-inset-bottom));
    background:rgba(0,0,0,.55);color:#fff;font-weight:800;font-size:13px;padding:8px 15px;border-radius:999px;
    display:flex;align-items:center;gap:7px;pointer-events:none;transition:opacity .3s ease;z-index:110}
  @media (max-width:899px){.hint{bottom:calc(120px + env(safe-area-inset-bottom))}}

  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation-duration:.001s !important}}
</style>

<header>
  <div class="bar">
    <div class="mark">🔍</div>
    <h1>Toy Window</h1>
    <span>tap a toy, then drag on the big picture to zoom</span>
  </div>
</header>

<main><div class="grid" id="grid"></div></main>

<div class="viewer" id="viewer" aria-hidden="true">
  <button class="vbtn v-close" id="vClose" aria-label="Close">✕</button>
  <button class="vbtn v-prev" id="vPrev" aria-label="Previous toy">‹</button>
  <button class="vbtn v-next" id="vNext" aria-label="Next toy">›</button>
  <div class="vwrap">
    <div class="vthumbs" id="vThumbs"></div>
    <div class="stage" id="stage">
      <img id="stageImg" alt="Toy picture">
      <div class="v-lens" id="vLens"></div>
    </div>
  </div>
  <div class="v-panel" id="vPanel"></div>
  <div class="vdots" id="vDots"></div>
  <div class="hint" id="hint">✋ drag over the picture to zoom</div>
</div>

const ZOOM = 3;
const AMZ = "https://m.media-amazon.com/images/I/";
function amz(id, size){ return AMZ + id.replace(/\+/g,"%2B") + "._AC_SL" + size + "_.jpg"; }

const grid = document.getElementById('grid');
let ti = 0, ii = 0;

TOYS.forEach((t,i)=>{
  const card=document.createElement('div');
  card.className='card'; card.tabIndex=0; card.setAttribute('role','button');
  card.setAttribute('aria-label','Look closer at this toy');
  const wrap=document.createElement('div'); wrap.className='imgwrap';
  const img=new Image();
  img.src=amz(t.ids[0], 400); img.alt='Toy picture';
  img.loading = i<16?'eager':'lazy'; img.decoding='async';
  img.addEventListener('error',()=>wrap.classList.add('broken'));
  wrap.appendChild(img); card.appendChild(wrap);
  if(t.ids.length>1){
    const c=document.createElement('div'); c.className='count'; c.innerHTML='📷 '+t.ids.length;
    card.appendChild(c);
  }
  card.addEventListener('click',()=>openViewer(i));
  card.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();openViewer(i);} });
  grid.appendChild(card);
});

const viewer=document.getElementById('viewer');
const stage=document.getElementById('stage');
const stageImg=document.getElementById('stageImg');
const vLens=document.getElementById('vLens');
const vPanel=document.getElementById('vPanel');
const vThumbs=document.getElementById('vThumbs');
const vDots=document.getElementById('vDots');
const hint=document.getElementById('hint');

function openViewer(i){ ti=i; ii=0; loadToy();
  viewer.classList.add('open'); viewer.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}
function closeViewer(){ viewer.classList.remove('open'); viewer.setAttribute('aria-hidden','true');
  document.body.style.overflow=''; stopZoom();
}
function loadToy(){
  const toy=TOYS[ti];
  vThumbs.innerHTML='';
  toy.ids.forEach((id,k)=>{
    const b=document.createElement('button');
    b.className='vthumb'; b.type='button';
    b.setAttribute('aria-label','Picture '+(k+1));
    b.setAttribute('aria-current', k===ii);
    const im=new Image(); im.src=amz(id,140); im.loading='lazy'; b.appendChild(im);
    b.addEventListener('click',()=>{ ii=k; showImg(); });
    vThumbs.appendChild(b);
  });
  vThumbs.style.display = toy.ids.length>1 ? 'flex':'none';
  showImg();
}
function showImg(){
  const toy=TOYS[ti];
  stopZoom();
  stage.classList.add('loading');
  stageImg.style.visibility='hidden';
  stageImg.onload=()=>{ stage.classList.remove('loading'); stageImg.style.visibility='visible'; };
  stageImg.onerror=()=>{ stage.classList.remove('loading'); stageImg.style.visibility='visible'; };
  stageImg.src=amz(toy.ids[ii], 1280);
  [...vThumbs.children].forEach((b,k)=>b.setAttribute('aria-current', k===ii));
  vDots.innerHTML='';
  if(toy.ids.length>1) toy.ids.forEach((_,k)=>{
    const d=document.createElement('i'); if(k===ii) d.className='on'; vDots.appendChild(d);
  });
  hint.style.opacity='1';
}
function stepToy(d){ ti=(ti+d+TOYS.length)%TOYS.length; ii=0; loadToy(); }
function stepImg(d){ const n=TOYS[ti].ids.length; ii=(ii+d+n)%n; showImg(); }

document.getElementById('vClose').addEventListener('click',closeViewer);
document.getElementById('vPrev').addEventListener('click',e=>{e.stopPropagation();stepToy(-1);});
document.getElementById('vNext').addEventListener('click',e=>{e.stopPropagation();stepToy(1);});
viewer.addEventListener('click',e=>{ if(e.target===viewer||e.target.classList.contains('vwrap')) closeViewer(); });
window.addEventListener('keydown',e=>{
  if(!viewer.classList.contains('open'))return;
  if(e.key==='Escape')closeViewer();
  else if(e.key==='ArrowLeft')stepToy(-1);
  else if(e.key==='ArrowRight')stepToy(1);
  else if(e.key==='ArrowUp'){e.preventDefault();stepImg(-1);}
  else if(e.key==='ArrowDown'){e.preventDefault();stepImg(1);}
});

function zoomAt(cx,cy){
  const r=stageImg.getBoundingClientRect();
  let x=cx-r.left, y=cy-r.top;
  if(x<0||y<0||x>r.width||y>r.height){ stopZoom(); return; }
  hint.style.opacity='0';
  const pw=vPanel.offsetWidth, ph=vPanel.offsetHeight;
  const lw=pw/ZOOM, lh=ph/ZOOM;
  let lx=Math.max(0,Math.min(x-lw/2,r.width-lw));
  let ly=Math.max(0,Math.min(y-lh/2,r.height-lh));
  const sr=stage.getBoundingClientRect();
  vLens.style.display='block';
  vLens.style.width=lw+'px'; vLens.style.height=lh+'px';
  vLens.style.left=(r.left-sr.left+lx)+'px';
  vLens.style.top=(r.top-sr.top+ly)+'px';
  vPanel.style.display='block';
  vPanel.style.backgroundImage=`url("${amz(TOYS[ti].ids[ii], 2000)}")`;
  vPanel.style.backgroundSize=(r.width*ZOOM)+'px '+(r.height*ZOOM)+'px';
  vPanel.style.backgroundPosition=`-${lx*ZOOM}px -${ly*ZOOM}px`;
}
function stopZoom(){ vLens.style.display='none'; vPanel.style.display='none'; }

let dragging=false;
stage.addEventListener('pointerdown',e=>{ dragging=true; try{stage.setPointerCapture(e.pointerId);}catch(_){} zoomAt(e.clientX,e.clientY); });
stage.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse' && !dragging){ zoomAt(e.clientX,e.clientY); return; }
  if(dragging) zoomAt(e.clientX,e.clientY);
});
stage.addEventListener('pointerup',e=>{ dragging=false; if(e.pointerType!=='mouse') stopZoom(); });
stage.addEventListener('pointercancel',()=>{ dragging=false; stopZoom(); });
stage.addEventListener('mouseleave',()=>{ if(!dragging) stopZoom(); });
</script>
